site_name: LÖVE Labo 사용자 가이드
site_url: https://tyt0815.github.io/LOVE-Labo/
repo_url: https://github.com/tyt0815/LOVE-Labo
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: build/docs-site
theme:
  name: readthedocs
  locale: ko
plugins:
  - search:
      lang: en
markdown_extensions:
  - admonition
  - tables
  - fenced_code
extra_css:
  - stylesheets/guide.css
nav:
  - 시작: index.md
  - 사용자 매뉴얼:
      - 첫 프로젝트와 실행: guide/getting-started.md
      - 에디터 화면과 선택: guide/editor.md
      - PIE 편집·복구: guide/play-tools.md
      - 에셋 관리와 복구: guide/assets.md
      - API 검수 예제: guide/examples.md
      - 플러그인: guide/plugins.md
      - 미리보기와 썸네일: guide/preview.md
      - 로그와 디버그 표시: guide/debugging.md
      - 스크립트와 Prefab: guide/objects.md
      - 카메라와 화면 UI: guide/camera-ui.md
      - 레벨 전환과 게임 저장: guide/game-state.md
      - 저장과 게임 Export: guide/export.md
      - Lua 빌드와 게임 CLI: guide/game-cli.md
  - Lua API:
      - 개요와 생명주기: guide/lua-api.md
      - 런타임 객체 생성: guide/runtime-spawn.md
      - 레벨 전환: guide/level-transition.md
      - 계층 Prefab: guide/hierarchy-prefabs.md
  - AI 및 CLI:
      - AI 시작 페이지: guide/ai.md
      - CLI 명령과 예제: guide/cli-and-export.md
  - 개발자:
      - 에디터 패키징: guide/packaging.md
      - 문서 빌드와 화면 캡처: guide/maintenance.md
      - 설계 결정: adr.md
